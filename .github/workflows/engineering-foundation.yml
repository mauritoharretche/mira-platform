name: Engineering foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - name: Record revision identity
        env:
          MIRA_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          MIRA_BASE: ${{ github.event.pull_request.base.sha || '' }}
          MIRA_PR: ${{ github.event.pull_request.number || '' }}
        run: |
          mise exec -- python -I -B - <<'PY'
          import json, os, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          parents = [line.split()[1] for line in git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          print('MIRA_DELIVERY_IDENTITY=' + json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'event': os.environ['GITHUB_EVENT_NAME'],
              'source': os.environ['MIRA_SOURCE'], 'base': os.environ['MIRA_BASE'], 'pr': os.environ['MIRA_PR'],
              'checkout': git('rev-parse', 'HEAD'), 'parents': parents, 'tree': git('rev-parse', 'HEAD^{tree}')
          }, sort_keys=True, separators=(',', ':')))
          PY
      - name: Test delivery automation
        run: mise exec -- python -I -B -m unittest discover -s tests/engineering -p 'test_*.py'
      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test "$(uname -m)" = "arm64"
          else
            test "$(uname -m)" = "x86_64"
          fi
      - run: mise exec -- python --version
      - run: mise exec -- node --version
      - run: mise exec -- pnpm --version
      - run: mise exec -- uv --version

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mira
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U mira -d mira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - name: Record revision identity
        env:
          MIRA_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          MIRA_BASE: ${{ github.event.pull_request.base.sha || '' }}
          MIRA_PR: ${{ github.event.pull_request.number || '' }}
        run: |
          mise exec -- python -I -B - <<'PY'
          import json, os, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          parents = [line.split()[1] for line in git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          print('MIRA_DELIVERY_IDENTITY=' + json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'event': os.environ['GITHUB_EVENT_NAME'],
              'source': os.environ['MIRA_SOURCE'], 'base': os.environ['MIRA_BASE'], 'pr': os.environ['MIRA_PR'],
              'checkout': git('rev-parse', 'HEAD'), 'parents': parents, 'tree': git('rev-parse', 'HEAD^{tree}')
          }, sort_keys=True, separators=(',', ':')))
          PY
      - name: Test delivery automation
        run: mise exec -- python -I -B -m unittest discover -s tests/engineering -p 'test_*.py'
      - working-directory: apps/api
        run: uv sync --locked
      - working-directory: apps/api
        run: uv run python manage.py check --settings=config.settings.test
      - working-directory: apps/api
        run: uv run python manage.py test --keepdb --settings=config.settings.test
      - name: Install locked browser-test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium test runtime
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the real operator browser workflow
        working-directory: apps/api
        env:
          MIRA_RUN_BROWSER_TESTS: "1"
        run: uv run python manage.py test system.tests.test_browser_workflow --keepdb --noinput --settings=config.settings.test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - name: Record revision identity
        env:
          MIRA_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          MIRA_BASE: ${{ github.event.pull_request.base.sha || '' }}
          MIRA_PR: ${{ github.event.pull_request.number || '' }}
        run: |
          mise exec -- python -I -B - <<'PY'
          import json, os, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          parents = [line.split()[1] for line in git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0].splitlines() if line.startswith('parent ')]
          print('MIRA_DELIVERY_IDENTITY=' + json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'event': os.environ['GITHUB_EVENT_NAME'],
              'source': os.environ['MIRA_SOURCE'], 'base': os.environ['MIRA_BASE'], 'pr': os.environ['MIRA_PR'],
              'checkout': git('rev-parse', 'HEAD'), 'parents': parents, 'tree': git('rev-parse', 'HEAD^{tree}')
          }, sort_keys=True, separators=(',', ':')))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build
