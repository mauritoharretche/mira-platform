name: Engineering foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - run: mise exec -- python --version
      - run: mise exec -- node --version
      - run: mise exec -- pnpm --version
      - run: mise exec -- uv --version

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mira
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U mira -d mira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - working-directory: apps/api
        run: uv sync --locked
      - working-directory: apps/api
        run: uv run python manage.py check --settings=config.settings.test
      - working-directory: apps/api
        run: uv run python manage.py test --keepdb --settings=config.settings.test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # jdx/mise-action v5.0.0, pinned to its immutable release commit.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.11.2
          install: false
      - run: mise install --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build
